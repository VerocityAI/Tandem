name: cohyve
description: Cohyve (working name) — multi-platform creator collaboration tool.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  cloud_functions: ^5.1.4
  firebase_storage: ^12.3.5
  firebase_remote_config: ^5.1.5
  firebase_analytics: ^11.3.5
  firebase_crashlytics: ^4.1.5
  firebase_app_check: ^0.3.1+5

  # Auth UX
  google_sign_in: ^6.2.2

  # State & nav & models
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  go_router: ^14.6.2

  # UI helpers
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4

  # Lucide Icons (outline style, modern)
  lucide_icons_flutter: ^3.1.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  very_good_analysis: ^7.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  mocktail: ^1.0.4
  golden_toolkit: ^0.15.0
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

# Native splash screen (Android + iOS). Generate with:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FAF5F0"
  color_dark: "#FAF5F0"
  image: assets/branding/cohyve_logo.png
  image_dark: assets/branding/cohyve_logo.png
  android_12:
    image: assets/branding/cohyve_logo.png
    color: "#FAF5F0"
    color_dark: "#FAF5F0"
  android: true
  ios: false
  web: false

# App launcher icons. Generate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  remove_alpha_ios: true
  image_path: "assets/branding/cohyve_logo.png"
  adaptive_icon_background: "#FAF5F0"
  adaptive_icon_foreground: "assets/branding/cohyve_logo.png"
  web:
    generate: true
    image_path: "assets/branding/cohyve_logo.png"
    background_color: "#FAF5F0"
    theme_color: "#B11F4B"


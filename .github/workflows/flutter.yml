name: flutter

# Disabled: workflows need updating to match current project state
# Re-enable push/PR triggers when CI is ready
on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run branding
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: apps/mobile
        run: |
          flutter create . --platforms=ios,android,web --org app.cohyve --project-name cohyve
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test

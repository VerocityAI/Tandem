name: functions

on:
  push:
    paths:
      - "functions/**"
      - "packages/shared-types/**"
      - ".github/workflows/functions.yml"
  pull_request:
    paths:
      - "functions/**"
      - "packages/shared-types/**"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm --workspace packages/shared-types run build
      - run: npm --workspace functions run lint --if-present
      - run: npm --workspace functions run build
      - run: npm --workspace functions run test --if-present

name: functions

# Disabled: workflows need updating to match current project state
# Re-enable push/PR triggers when CI is ready
on:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm --workspace packages/shared-types run build
      - run: npm --workspace functions run lint --if-present
      - run: npm --workspace functions run build
      - run: npm --workspace functions run test --if-present

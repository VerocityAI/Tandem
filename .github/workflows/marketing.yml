name: marketing

# Disabled: workflows need updating to match current project state
# Re-enable push/PR triggers when CI is ready
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run branding
      - run: npm --workspace apps/marketing run lint
      - run: npm --workspace apps/marketing run build
      - uses: actions/upload-artifact@v4
        with:
          name: marketing-dist
          path: apps/marketing/dist

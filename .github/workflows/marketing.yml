name: marketing

on:
  push:
    paths:
      - "apps/marketing/**"
      - "packages/branding/**"
      - ".github/workflows/marketing.yml"
  pull_request:
    paths:
      - "apps/marketing/**"
      - "packages/branding/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run branding
      - run: npm --workspace apps/marketing run lint
      - run: npm --workspace apps/marketing run build
      - uses: actions/upload-artifact@v4
        with:
          name: marketing-dist
          path: apps/marketing/dist
